<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZHYR — Ecos de Nexus</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050615;color:#e9eaff;font-family:system-ui,Arial}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
#brand{position:absolute;top:16px;left:18px;letter-spacing:.28em;font-weight:800;font-size:14px;color:#d9e5ff;text-shadow:0 0 16px #74bfff}
#zone{position:absolute;top:40px;left:18px;font-size:10px;letter-spacing:.2em;color:#9aa8ce}
#hint{position:absolute;top:16px;right:18px;font-size:11px;color:#b9c6e8;text-align:right}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.pad,.actions{display:flex;gap:12px;pointer-events:auto}
.ctrl{width:58px;height:58px;border:1px solid #91b8ff66;border-radius:18px;background:#101a36aa;color:#eaf2ff;font-size:24px;backdrop-filter:blur(8px);box-shadow:0 0 22px #347bff22;touch-action:none}
.ctrl:active{background:#345b9b99;transform:scale(.96)}
#tip{position:fixed;bottom:94px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.12em;color:#b7c7e9;background:#080d20a8;padding:7px 12px;border:1px solid #9dbbff33;border-radius:20px;white-space:nowrap}
@media(min-width:800px){#controls{opacity:.72}.ctrl{width:54px;height:54px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div id="brand">Z H Y R</div><div id="zone">SETOR 01 · NEXUS</div><div id="hint">ECOS DE UM MUNDO PERDIDO<br>ENCONTRA O PORTAL</div></div>
<div id="tip">A / D ou ← / → para mover · Espaço para saltar · J para pulso</div>
<div id="controls">
 <div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
 <div class="actions"><button class="ctrl" id="jump">↟</button><button class="ctrl" id="pulse">✧</button></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const world={w:3000,ground:0}, keys={left:false,right:false};
let cam=0,t=0,particles=[],pulse=0,portalX=2670;
const player={x:130,y:0,vx:0,vy:0,on:false,face:1,health:3};
const platforms=[{x:0,y:0,w:660},{x:760,y:0,w:440},{x:1320,y:0,w:560},{x:2010,y:0,w:990},
{x:470,y:-105,w:150},{x:960,y:-145,w:170},{x:1510,y:-120,w:190},{x:2200,y:-150,w:180}];
const stars=Array.from({length:180},()=>({x:Math.random()*3600,y:Math.random()*900,s:.4+Math.random()*1.8,a:.25+Math.random()*.7}));
const plants=Array.from({length:70},(_,i)=>({x:90+i*42+Math.random()*25,h:22+Math.random()*62,k:Math.random()*6.28}));
function groundAt(x){let p=platforms.find(p=>x>p.x&&x<p.x+p.w);return p?p.y:null}
function burst(x,y,n=18){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,life:35+Math.random()*25})}
function bind(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false))}
bind('left','left');bind('right','right');
function jump(){if(player.on){player.vy=-11.8;player.on=false;burst(player.x,player.y+8,7)}}
function fire(){pulse=18;burst(player.x+player.face*28,player.y-24,22)}
document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};
document.getElementById('pulse').onpointerdown=e=>{e.preventDefault();fire()};
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(e.code==='Space'){e.preventDefault();jump()}if(e.key==='j'||e.key==='J')fire()});
addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawSky(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07091d');g.addColorStop(.52,'#17143b');g.addColorStop(1,'#080b20');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // distant nebulae
 for(let i=0;i<5;i++){let x=((i*520-cam*.12)%(W+600)+W+600)%(W+600)-180;let y=H*(.18+(i%3)*.13);
 let rg=ctx.createRadialGradient(x,y,2,x,y,230);rg.addColorStop(0,['#713eaa44','#2767a844','#a53b7940'][i%3]);rg.addColorStop(1,'#15163800');ctx.fillStyle=rg;ctx.fillRect(x-240,y-240,480,480)}
 // stars
 for(const s of stars){let x=(s.x-cam*.18)%(W+20);if(x<0)x+=W+20;ctx.globalAlpha=s.a*(.75+.25*Math.sin(t*.025+s.x));ctx.fillStyle='#d9e8ff';ctx.beginPath();ctx.arc(x,s.y%H,s.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 // enormous ringed planet
 let px=W*.78-cam*.035,py=H*.24;ctx.save();ctx.translate(px,py);ctx.rotate(-.22);
 ctx.strokeStyle='#9c9aff55';ctx.lineWidth=17;ctx.beginPath();ctx.ellipse(0,0,145,36,0,0,Math.PI*2);ctx.stroke();
 let pg=ctx.createRadialGradient(-32,-35,5,0,0,94);pg.addColorStop(0,'#d5b5e8');pg.addColorStop(.45,'#755da9');pg.addColorStop(1,'#242653');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(0,0,83,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#d7c9ff77';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,145,36,0,0,Math.PI*2);ctx.stroke();ctx.restore();
}
function drawMountains(){
 for(let layer=0;layer<3;layer++){let speed=.28+layer*.19,base=H*(.68+layer*.08),step=190;ctx.beginPath();ctx.moveTo(0,H);
 for(let x=-step;x<W+step;x+=step){let wx=x+cam*speed;let peak=base-70-Math.sin(wx*.004+layer)*36-Math.sin(wx*.011)*25;ctx.lineTo(x,peak);ctx.lineTo(x+step*.5,peak-35-layer*13);ctx.lineTo(x+step,base)}
 ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=['#171b43','#111832','#0b1428'][layer];ctx.fill()}
}
function drawRuins(){
 for(let i=0;i<18;i++){let wx=i*205+100,x=wx-cam*.72;if(x<-150||x>W+150)continue;let h=70+(i*37%100);ctx.fillStyle='#202747';ctx.fillRect(x,H*.72-h,32,h);ctx.fillRect(x-12,H*.72-h-12,56,13);ctx.fillStyle='#4d6b9b55';ctx.fillRect(x+7,H*.72-h+18,4,h-20);ctx.fillStyle='#7ddaff55';ctx.fillRect(x+13,H*.72-h+27,3,17)}
}
function drawTerrain(){
 for(const p of platforms){let x=p.x-cam,y=H*.78+p.y;if(x+p.w<0||x>W)continue;
 let grad=ctx.createLinearGradient(0,y,0,y+100);grad.addColorStop(0,'#30395e');grad.addColorStop(.14,'#18213e');grad.addColorStop(1,'#080d20');ctx.fillStyle=grad;ctx.fillRect(x,y,p.w,H-y);
 ctx.fillStyle='#82b9d5';ctx.fillRect(x,y,p.w,3);ctx.fillStyle='#6b78aa55';for(let k=0;k<p.w;k+=38)ctx.fillRect(x+k,y+15+(k%3)*8,17,2)}
 // alien grass
 for(const p of plants){let x=p.x-cam;if(x<-30||x>W+30)continue;let y=H*.78;ctx.strokeStyle='#54c4b0aa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+Math.sin(t*.04+p.k)*12,y-p.h*.6,x+Math.sin(t*.04+p.k+1)*17,y-p.h);ctx.stroke();ctx.fillStyle='#a5f4d966';ctx.beginPath();ctx.arc(x+Math.sin(t*.04+p.k+1)*17,y-p.h,3,0,Math.PI*2);ctx.fill()}
}
function drawPortal(){let x=portalX-cam,y=H*.78-74;if(x<-100||x>W+100)return;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*.02)*.04);ctx.strokeStyle='#7be9ff';ctx.shadowColor='#6beaff';ctx.shadowBlur=25;ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,0,34,65,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#bb8cff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,22,53,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function drawZhyr(){
 let x=player.x-cam,y=H*.78+player.y;ctx.save();ctx.translate(x,y);if(player.face<0)ctx.scale(-1,1);
 // tail
 ctx.strokeStyle='#26324f';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-15,-24);ctx.quadraticCurveTo(-43,-42,-57,-18+Math.sin(t*.12)*7);ctx.stroke();ctx.strokeStyle='#7deaff';ctx.lineWidth=2;ctx.stroke();
 // legs
 for(let i=0;i<4;i++){let lx=-13+(i%2)*18,back=i<2?1:0;ctx.strokeStyle='#202a49';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(lx,-13);ctx.lineTo(lx+(back?-7:7),-2+Math.sin(t*.18+i)*2);ctx.lineTo(lx+(back?-10:10),0);ctx.stroke()}
 // body silhouette
 let body=ctx.createRadialGradient(-7,-37,3,0,-27,32);body.addColorStop(0,'#53658a');body.addColorStop(.55,'#202b4a');body.addColorStop(1,'#0b1025');ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,-27,28,22,-.1,0,Math.PI*2);ctx.fill();
 // head and ears / crest
 ctx.fillStyle='#263454';ctx.beginPath();ctx.ellipse(15,-45,22,20,-.2,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.moveTo(7,-58);ctx.lineTo(1,-78);ctx.lineTo(19,-61);ctx.fill();ctx.beginPath();ctx.moveTo(23,-59);ctx.lineTo(35,-75);ctx.lineTo(34,-52);ctx.fill();
 // markings
 ctx.strokeStyle='#78c9d8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-17,-33);ctx.lineTo(-7,-42);ctx.lineTo(1,-34);ctx.stroke();
 // bright eyes
 ctx.shadowColor='#9cf7ff';ctx.shadowBlur=18;ctx.fillStyle='#d9ffff';ctx.beginPath();ctx.ellipse(24,-47,4,6,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle='#0a122a';ctx.beginPath();ctx.arc(25,-47,1.5,0,Math.PI*2);ctx.fill();
 if(pulse>0){ctx.strokeStyle='#7cecff';ctx.globalAlpha=pulse/18;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-31,35+(18-pulse)*3,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
 ctx.restore();
}
function drawParticles(){for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/55);ctx.fillStyle='#8deaff';ctx.beginPath();ctx.arc(p.x-cam,p.y+H*.78,2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--}particles=particles.filter(p=>p.life>0)}
function frame(){
 t++;ctx.clearRect(0,0,W,H);drawSky();drawMountains();drawRuins();drawTerrain();drawPortal();
 let dir=(keys.right?1:0)-(keys.left?1:0);if(dir){player.vx+=dir*.65;player.face=dir}else player.vx*=.82;player.vx=Math.max(-4.2,Math.min(4.2,player.vx));
 player.x=Math.max(20,Math.min(world.w-20,player.x+player.vx));player.vy+=.55;player.y+=player.vy;player.on=false;
 let gy=groundAt(player.x);if(gy!==null&&player.y>=gy){player.y=gy;player.vy=0;player.on=true}
 if(player.y>180){player.x=Math.max(80,player.x-20);player.y=0;player.vy=0}
 cam=Math.max(0,Math.min(world.w-W,player.x-W*.38));
 drawZhyr();drawParticles();if(pulse>0)pulse--;
 if(player.x>portalX-30){document.getElementById('zone').textContent='PORTAL DETETADO · NOVO SETOR';}
 requestAnimationFrame(frame)
}
frame();
})();
</script>
</body>
</html>
